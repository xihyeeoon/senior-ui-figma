<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; color: #000; }
  label { display: block; margin: 0 0 12px; font-weight: 600; }
  input { display: block; margin-top: 4px; font-weight: 400; }
  button { padding: 8px 16px; font-size: 13px; }
  #say, #pics { margin-top: 12px; white-space: pre-wrap; }
  #pics { max-height: 160px; overflow: auto; font-size: 12px; color: #555; }
</style>
<label>1. storyboard.json
  <input id="json" type="file" accept=".json,application/json">
</label>
<label>2. shots/ 의 그림 (여러 개 고르기)
  <input id="shots" type="file" accept="image/png" multiple>
</label>
<button id="go">그리기</button>
<div id="say"></div>
<div id="pics"></div>
<div id="ask" hidden><button id="yes"></button> <button id="no">취소</button></div>
<script>
  const $ = id => document.getElementById(id);
  const say = t => { $('say').textContent = t; };
  // 묻기: [yes] [취소]. 취소하면 아무것도 보내지 않는다 (Figma 쪽은 그대로).
  const ask = (text, yes) => new Promise(ok => {
    say(text); $('yes').textContent = yes; $('ask').hidden = false;
    $('yes').onclick = () => { $('ask').hidden = true; ok(true); };
    $('no').onclick = () => { $('ask').hidden = true; say('취소했다 — 아무것도 바꾸지 않았다.'); ok(false); };
  });
  let last = null;   // 마지막으로 보낸 것 - 옛 페이지를 지워도 되냐는 물음에 '예' 면 다시 보낸다
  const send = m => { last = m; parent.postMessage({ pluginMessage: m }, '*'); };
  // Figma createImage 는 가로 · 세로 4096px 넘는 그림을 받지 않는다. 줄이지 않고 같은 크기로
  // 잘라 PNG 로 다시 만든다. 위→아래 줄마다 왼쪽→오른쪽 (src/plan.ts 의 tiles 와 같다).
  const MAX_PX = 4096;
  const cuts = n => { const a = []; for (let p = 0; p < n; p += MAX_PX) a.push([p, Math.min(MAX_PX, n - p)]); return a; };
  const tiles = (w, h) => cuts(h).flatMap(([y, th]) => cuts(w).map(([x, tw]) => [x, y, tw, th]));
  async function slice(f, images, dims) {
    const bmp = await createImageBitmap(f);
    dims[f.name] = [bmp.width, bmp.height];
    const ts = tiles(bmp.width, bmp.height);
    if (ts.length === 1) { images[f.name + '#1'] = new Uint8Array(await f.arrayBuffer()); return; }
    for (const [i, [x, y, w, h]] of ts.entries()) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(bmp, x, y, w, h, 0, 0, w, h);
      const png = await new Promise(ok => c.toBlob(ok, 'image/png'));
      images[`${f.name}#${i + 1}`] = new Uint8Array(await png.arrayBuffer());
    }
  }
  $('go').onclick = async () => {
    const json = $('json').files[0];
    if (!json) return say('storyboard.json 을 먼저 고르세요.');
    // 그리기 전에: storyboard.json 이 기대하는 그림 (sheet.picture 의 파일 이름) 과 고른 파일을 맞춰 본다
    let sb; try { sb = JSON.parse(await json.text()); } catch { return say('storyboard.json 을 읽지 못했다.'); }
    const want = [...new Set((sb.sheets || []).map(s => (s.picture || '').split('/').pop()).filter(Boolean))];
    const have = new Set([...$('shots').files].map(f => f.name)), hit = want.filter(n => have.has(n));
    $('pics').textContent = `기대하는 그림 ${want.length} · 맞음 ${hit.length} · 빠짐 ${want.length - hit.length}\n`
      + want.map(n => (have.has(n) ? '✓ ' : '✗ 빠짐 ') + n).join('\n');
    if (want.length && !hit.length
        && !await ask('고른 그림 중 맞는 이름이 하나도 없다. storyboard/shots/ 의 재설계 화면 그림이어야 한다 (원본 캡처가 아님).', '그대로 그리기')) return;
    const images = {}, dims = {};
    say('그림 읽는 중…');
    for (const f of $('shots').files) try { await slice(f, images, dims); } catch {}   // 못 읽으면 '그림 없음'
    say('그리는 중…');
    send({ storyboard: await json.text(), images, dims });
  };
  onmessage = async e => {
    const m = e.data.pluginMessage;
    if (m?.ask) { if (await ask(m.ask, m.yes)) { say('그리는 중…'); send({ ...last, confirmed: true }); } }
    else if (m) say(m.text);
  };
</script>
