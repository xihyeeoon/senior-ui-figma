<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; color: #000; }
  label { display: block; margin: 0 0 12px; font-weight: 600; }
  input { display: block; margin-top: 4px; font-weight: 400; }
  button { padding: 8px 16px; font-size: 13px; }
  #say { margin-top: 12px; white-space: pre-wrap; }
</style>
<label>1. storyboard.json
  <input id="json" type="file" accept=".json,application/json">
</label>
<label>2. shots/ 의 그림 (여러 개 고르기)
  <input id="shots" type="file" accept="image/png" multiple>
</label>
<button id="go">그리기</button>
<div id="say"></div>
<script>
  const $ = id => document.getElementById(id);
  const say = t => { $('say').textContent = t; };
  $('go').onclick = async () => {
    const json = $('json').files[0];
    if (!json) return say('storyboard.json 을 먼저 고르세요.');
    const images = {};
    for (const f of $('shots').files) images[f.name] = new Uint8Array(await f.arrayBuffer());
    say('그리는 중…');
    parent.postMessage({ pluginMessage: { storyboard: await json.text(), images } }, '*');
  };
  onmessage = e => { const m = e.data.pluginMessage; if (m) say(m.text); };
</script>
